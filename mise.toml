# Bootstraps the toolchain and is the one entry point: `mise run <task>`, the same task names in every nullean repo.
# The .NET SDK version lives only in global.json: the first dotnet entry reads it from there (sdk.version is the first
# "version" key). The net10.0 runtime is listed after it because nupkg-validator and the public API diff run on
# net10.0.

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = ["""{{ read_file(path='global.json') | split(pat='"version"') | nth(n=1) | split(pat='"') | nth(n=1) }}""", "10"]
gh = "latest"
zizmor = "1"

[tasks.setup]
description = "Restore the local .NET tools (minver, nupkg-validator)"
run = "dotnet tool restore"

[tasks.build]
description = "Build the solution"
depends = ["setup"]
run = "dotnet run --project build/scripts -- build"

[tasks.format]
description = "Format the repository with curb"
depends = ["setup"]
run = "dotnet curb format ."

[tasks.check]
description = "Fail on formatting drift (curb) and on workflow findings (zizmor)"
depends = ["setup"]
run = ["dotnet curb check .", "zizmor --min-severity medium ."]

[tasks.pack]
description = "Build, pack the NuGet packages, validate them and report public API changes"
depends = ["setup"]
run = "dotnet run --project build/scripts -- pack"

[tasks.clean]
description = "Delete build output"
run = "dotnet run --project build/scripts -- clean"

[tasks.ci]
description = "What CI's build job runs on every push: build, pack, validate and diff the public API, then fail on formatting drift (curb)"
depends = ["setup"]
run = ["dotnet run --project build/scripts -- ci", "dotnet curb check ."]

[tasks.release]
description = "Open the release-drafter draft; `mise run release publish` publishes it, which releases"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName')
if [ -z "$tag" ]; then
  echo "no draft release; merge a labelled pull request to main first" >&2
  exit 1
fi
if [ "${1:-}" = "publish" ]; then
  gh release edit "$tag" --draft=false
  echo "published $tag; the release workflow is now packing and pushing it"
else
  gh release view "$tag"
  echo
  echo "publish with: mise run release publish   (or promote the draft on github.com)"
fi
'''
