# Drafts the next release from merged pull request labels. Publishing the draft releases (see workflows/release.yml).
#
# Since 1.0.0, `breaking` bumps the major version.
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
categories:
  - title: '💥 Breaking Changes'
    labels: [breaking]
  - title: '✨ Features'
    labels: [feature, enhancement]
  - title: '🐛 Bug Fixes'
    labels: [bug, fix]
  - title: '📝 Documentation'
    labels: [documentation]
  - title: '🧰 Maintenance'
    labels: [chore, dependencies]
  - title: '⚙️ Automation'
    labels: [ci]
exclude-labels:
  - 'changelog:skip'
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  default: patch
