name: create-major-tag

# Lets a workflow pin this repo as a GitHub Action with `uses: nullean/assembly-differ@v1` instead of
# an exact release tag, the same way actions/checkout@v5 stays on v5 across patch and minor releases.

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: create-major-tag
  cancel-in-progress: false

jobs:
  # A release moves the major tag only for a commit main has already proven: wait for main's push run of ci.yml on the
  # released commit and stop unless it passed.
  main-green:
    name: main is green
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read # read main's ci.yml runs
    steps:
      - uses: nullean/.github/actions/require-green-main@f9eb30d28e48b3f6b8ff1f4e7dae1d2b7b2d544b # v1.6.0

  create-major-tag:
    needs: main-green
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # this job pushes the major tag

      - name: Validate and extract major version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match expected semver format (N.N.N)"
            exit 1
          fi
          echo "MAJOR_VERSION=${TAG%%.*}" >> "${GITHUB_ENV}"

      - name: Create major tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "v${MAJOR_VERSION}"
          git push -f origin "refs/tags/v${MAJOR_VERSION}"
