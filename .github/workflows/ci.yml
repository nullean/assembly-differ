name: Always be deploying

on:
  pull_request:
    paths-ignore: 
      - 'README.md'
      - '.editorconfig'
  push:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
    branches:
      - master 
    tags:
      - "*.*.*"

jobs:
  # Native AOT can only compile for the OS/arch it runs on, so each leg compiles its own RID and
  # packs the per-RID tool package. The coordinating build job below takes only the root package and
  # the portable 'any' fallback from a plain `dotnet pack` — see generatePackages in
  # build/scripts/Targets.fs. On pull requests only linux-x64 runs, to prove AOT still links; the
  # other four RIDs get the same proof on every push.
  # On pull requests, only linux-x64 runs, to prove AOT still links without burning the full matrix
  # on packages nobody sees. All five run on push, where the packages are actually uploaded.
  aot-pack:
    runs-on: ${{ matrix.runner }}
    name: AOT pack (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"rid":"linux-x64","runner":"ubuntu-latest"}]'
          || '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"},{"rid":"osx-arm64","runner":"macos-latest"}]') }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - run: dotnet pack src/assembly-differ/assembly-differ.csproj -c Release -r ${{ matrix.rid }} -o build/output
      name: Pack native-AOT tool for ${{ matrix.rid }}
      shell: bash

    # Container image, linux-x64 only for now — the platform every GitHub-hosted Linux runner
    # already matches. No --push here and no registry login on this leg, so this only proves the
    # container build itself still works: AOT compiles, the chiseled base image resolves, and the
    # SDK's container tooling produces an image in the local Docker daemon. The real push to
    # ghcr.io happens once, in the build job below, which does pass --push.
    - name: Build container image (no push)
      if: matrix.rid == 'linux-x64'
      run: ./build.sh publishcontainers -s true
      shell: bash

    - name: Report container image size
      if: matrix.rid == 'linux-x64'
      shell: bash
      run: docker images nullean/assembly-differ --format '{{.Tag}}\t{{.Size}}'

    - name: Upload per-RID package
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: nupkg-${{ matrix.rid }}
        path: build/output/*.nupkg
        if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: aot-pack
    permissions:
      contents: write   # create GitHub release
      packages: write   # push to GitHub Packages and ghcr.io
      issues: write     # release-notes creates labels for its categories
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - run: |
        git fetch --prune --unshallow --tags
        echo exit code $?
        git tag --list
    - uses: actions/setup-dotnet@v5
      with:
          dotnet-version: |
            10.0.x
          source-url: https://nuget.pkg.github.com/nullean/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - run: ./build.sh build -s true
      name: Build
    
    - run: ./build.sh generatepackages -s true
      name: Generate local nuget packages

    - name: Download per-RID AOT packages
      if: github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: nupkg-*
        path: build/output
        merge-multiple: true

    # - run: ./build.sh validatepackages -s true
    #   name: "validate *.npkg files that were created"
    
    - run: ./build.sh generateapichanges -s true
      name: "Inspect public API changes"

    - name: publish to github package repository
      if: github.event_name == 'push' && startswith(github.ref, 'refs/heads')
      shell: bash
      run:  |
         until dotnet nuget push build/output/*.nupkg -k ${{secrets.GITHUB_TOKEN}} --skip-duplicate --no-symbols true; do echo "Retrying"; sleep 1; done;

    # ghcr.io/nullean/assembly-differ, matching curb's own tagging: "edge" on every push, plus
    # "latest" and the semver when this push is an exact release tag — see
    # publishContainers/containerImageTags in Targets.fs for how that split is decided.
    - name: Log in to ghcr.io
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish container image
      if: github.event_name == 'push'
      run: ./build.sh publishcontainers -s true --push

    - run: ./build.sh generatereleasenotes -s true
      name: Generate release notes for tag
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')

    - run: ./build.sh createreleaseongithub -s true --token ${{secrets.GITHUB_TOKEN}}
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
      name: Create or update release for tag on github
      
    - run: dotnet nuget push 'build/output/*.nupkg' -k ${{secrets.NUGET_ORG_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols true
      name: release to nuget.org
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
