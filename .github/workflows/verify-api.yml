name: verify-api

# The verify-api action, run from this checkout with the released tool, on this repository's own api/: it proves the
# action end to end on every pull request, and keeps a comment when api/ is out of date.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false
        env:
          MISE_JOBS: "1"
      - run: dotnet build src/Nullean.PublicApi.Diff -c Release
      - uses: ./verify-api
        with:
          directory: api
          projects: |
            src/Nullean.PublicApi/Nullean.PublicApi.csproj
            src/Nullean.PublicApi.Diff/Nullean.PublicApi.Diff.csproj
          comment: 'true'
